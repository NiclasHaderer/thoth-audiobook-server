name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fails a PR whose API is not bwc and fwc
  api-compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: head

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate the merged spec
        working-directory: head
        run: ./gradlew :server:generateClients -x :taglib:buildNativeHost

      - name: Generate the base spec
        working-directory: base
        run: ./gradlew :server:generateClients -x :taglib:buildNativeHost

      - name: Compare versions
        id: gate
        run: |
          base_version=$(yq '.info.version' base/gen/openapi.yaml)
          head_version=$(yq '.info.version' head/gen/openapi.yaml)
          if [[ "$head_version" != "$base_version" ]]; then
            echo "API version changed from $base_version to $head_version, breaking changes are allowed."
            echo "fail_on=" >> "$GITHUB_OUTPUT"
          else
            echo "fail_on=ERR" >> "$GITHUB_OUTPUT"
          fi

      - name: Check old clients work with new servers
        uses: oasdiff/oasdiff-action/breaking@v0.1.17
        with:
          base: base/gen/openapi.yaml
          revision: head/gen/openapi.yaml
          fail-on: ${{ steps.gate.outputs.fail_on }}
          review: 'false'
          github-token: ''

      - name: Check new clients work with old servers
        if: ${{ !cancelled() && steps.gate.outcome == 'success' }}
        uses: oasdiff/oasdiff-action/breaking@v0.1.17
        env:
          OASDIFF_CONFIG: head/.github/oasdiff/config.yaml
        with:
          base: head/gen/openapi.yaml
          revision: base/gen/openapi.yaml
          fail-on: ${{ steps.gate.outputs.fail_on }}
          review: 'false'
          github-token: ''

      - name: Explain how to fix a breaking change
        if: failure() && steps.gate.outputs.fail_on == 'ERR'
        run: |
          echo "::error file=server/src/main/kotlin/io/thoth/server/plugins/OpenApi.kt::This PR's API is not compatible with the base branch in at least one direction. Bump the version in info { version = ... }."
          exit 1

  # Builds libtag_c from the bundled TagLib fork on every platform we ship, and runs
  # the :taglib tests against the freshly built host library.
  native:
    name: native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-14
          - target: windows-x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Compiles the native library (via CMake) and exercises it through the FFM bindings.
      - run: ./gradlew :taglib:test

      - name: Stage the built library
        shell: bash
        run: |
          mkdir -p staging/${{ matrix.target }}
          cp taglib/build/nativeResources/native/${{ matrix.target }}/* staging/${{ matrix.target }}/

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: staging
          if-no-files-found: error

  # Bundles every platform's library into the jar and runs the whole test suite.
  package:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: taglib/src/main/resources/native

      # buildNativeHost would overwrite the host entry with a fresh build; the downloaded
      # artifacts are what we want to ship, so only the remaining work runs here.
      - run: ./gradlew build -x :taglib:buildNativeHost

      - uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: server/build/libs/*.jar
          if-no-files-found: error
