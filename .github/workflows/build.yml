name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  # Fails a PR whose API is not bwc and fwc
  api-compat:
    name: API compatibility
    if: ${{ false && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR merged into its base
        uses: actions/checkout@v4
        with:
          path: head

      - name: Check out the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate the merged spec
        working-directory: head
        run: ./gradlew :server:generateClients -x :taglib:buildNativeHost

      - name: Generate the base spec
        working-directory: base
        run: ./gradlew :server:generateClients -x :taglib:buildNativeHost

      - name: Compare API versions
        id: gate
        run: |
          base_version=$(yq '.info.version' base/gen/openapi.yaml)
          head_version=$(yq '.info.version' head/gen/openapi.yaml)
          if [[ "$head_version" != "$base_version" ]]; then
            echo "API version changed from $base_version to $head_version, breaking changes are allowed."
            echo "fail_on=" >> "$GITHUB_OUTPUT"
          else
            echo "fail_on=ERR" >> "$GITHUB_OUTPUT"
          fi

      - name: Check old clients work with new servers
        uses: oasdiff/oasdiff-action/breaking@v0.1.17
        with:
          base: base/gen/openapi.yaml
          revision: head/gen/openapi.yaml
          fail-on: ${{ steps.gate.outputs.fail_on }}
          review: 'false'
          github-token: ''

      - name: Check new clients work with old servers
        if: ${{ !cancelled() && steps.gate.outcome == 'success' }}
        uses: oasdiff/oasdiff-action/breaking@v0.1.17
        env:
          OASDIFF_CONFIG: head/.github/oasdiff/config.yaml
        with:
          base: head/gen/openapi.yaml
          revision: base/gen/openapi.yaml
          fail-on: ${{ steps.gate.outputs.fail_on }}
          review: 'false'
          github-token: ''

      - name: Explain how to fix a breaking change
        if: failure() && steps.gate.outputs.fail_on == 'ERR'
        run: |
          echo "::error file=server/src/main/kotlin/io/thoth/server/plugins/OpenApi.kt::This PR's API is not compatible with the base branch in at least one direction. Bump the version in info { version = ... }."
          exit 1

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-latest","linux-arm64":"ubuntu-24.04-arm","macos-x64":"macos-15-intel","macos-arm64":"macos-14","windows-x64":"windows-latest"}')[matrix.target] }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-all-platforms')) && '["linux-x64","linux-arm64","macos-x64","macos-arm64","windows-x64"]' || '["linux-arm64"]') }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The library only changes with the TagLib fork or its CMake setup. Keying on the submodule
      # commit instead of its files lets a cache hit skip the submodule checkout as well as the
      # CMake build, which takes up to 18 minutes on macOS.
      - name: Compute the TagLib cache key
        id: native-key
        shell: bash
        run: echo "key=libtag_c-${{ matrix.target }}-$(git rev-parse HEAD:taglib/native/taglib)-${{ hashFiles('taglib/native/CMakeLists.txt') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the built TagLib
        id: native-cache
        uses: actions/cache@v6
        with:
          path: taglib/build/nativeResources/native/${{ matrix.target }}
          key: ${{ steps.native-key.outputs.key }}

      - name: Check out the TagLib sources
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build TagLib
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: ./gradlew :taglib:buildNativeHost

      - name: Test the TagLib bindings
        if: matrix.target != 'linux-arm64'
        run: ./gradlew :taglib:test -x :taglib:buildNativeHost

      - name: Test everything
        if: matrix.target == 'linux-arm64'
        run: ./gradlew check -x :taglib:buildNativeHost -PskipLiveTests
